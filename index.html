<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Duck Hunts: The Ducks Strike Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0b10;color:#ddd;overflow:hidden;
    font-family:'Press Start 2P',monospace;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #screen{position:relative;border:6px solid #26262c;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 2px #000,0 10px 40px rgba(0,0,0,.7)}
  canvas{outline:none;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;background:#000}
  #crt{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.22) 50%);
    box-shadow:inset 0 0 70px rgba(0,0,0,.55)}
  #crt.off{display:none}
  #pad{display:none;width:min(100vw,540px);height:140px;justify-content:space-between;align-items:center;padding:0 14px;box-sizing:border-box}
  body.touch #pad{display:flex}
  .dpad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:2px}
  .dpad button{background:#2e2e34;color:#aaa;border:none;border-radius:6px;font-size:14px;font-family:inherit}
  .dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
  .mid{display:flex;flex-direction:column;gap:10px}
  .mid button{background:#3a3a40;color:#bbb;border:none;border-radius:10px;padding:8px 12px;font-family:inherit;font-size:9px}
  .ab{display:flex;gap:14px;align-items:flex-end}
  .ab button{width:66px;height:66px;border-radius:50%;border:3px solid #111;background:#c8102e;color:#fff;
    font-family:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 4px 0 #6a0010}
  .ab button small{font-size:7px;opacity:.85}
  .ab .b{margin-bottom:22px}
  button:active{filter:brightness(1.4)}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen"><canvas id="game" tabindex="0"></canvas><div id="crt"></div></div>
  <div id="pad">
    <div class="dpad">
      <button class="u" data-k="arrowup">▲</button><button class="l" data-k="arrowleft">◀</button>
      <button class="r" data-k="arrowright">▶</button><button class="d" data-k="arrowdown">▼</button>
    </div>
    <div class="mid"><button data-act="egg">EGG</button><button data-act="wpn">WEAPON</button><button data-act="pause">PAUSE</button></div>
    <div class="ab">
      <button class="b" data-act="knife">B<small>KNIFE</small></button>
      <button class="a" data-act="fire">A<small>FIRE</small></button>
    </div>
  </div>
</div>
<script>
'use strict';

const W=256,H=240,GROUND=192;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const crtEl=document.getElementById('crt');
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');

function resize(){
  const padH=isTouch?150:0;
  const aw=innerWidth-24,ah=innerHeight-padH-24;
  let s=Math.min(aw/W,ah/H);
  if(s>=3)s=Math.floor(s);
  s=Math.max(.8,s);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  crtEl.style.backgroundSize='100% '+Math.max(2,s)+'px';
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const F=s=>s+'px "Press Start 2P", monospace';
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
let seed=1337;function srand(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function sprite(rows,pal){
  const w=Math.max(1,...rows.map(r=>r.length)),h=rows.length,c=mk(w,h),g=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const p=pal[r[i]];if(p){g.fillStyle=p;g.fillRect(i,j,1,1);}}});
  return c;
}
function flip(c){const f=mk(c.width,c.height),g=f.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f;}
function txt(s,x,y,col='#fff',size=8,align='left',shadow=null){
  ctx.font=F(size);ctx.textAlign=align;ctx.textBaseline='top';
  if(shadow){ctx.fillStyle=shadow;ctx.fillText(s,x+1,y+1);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function box(x,y,w,h){ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#fcfcfc';ctx.lineWidth=1;ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);}
function pixLine(x0,y0,x1,y1,col){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);ctx.fillStyle=col;
  let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;
  for(let n=0;n<400;n++){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}
}
function bubble(s,cx,y){
  const w=s.length*8+6;let x=Math.round(cx-w/2);x=clamp(x,2,W-w-2);
  ctx.fillStyle='#fcfcfc';ctx.fillRect(x,y,w,12);ctx.fillStyle='#000';ctx.fillRect(x+1,y+1,w-2,10);
  txt(s,x+3,y+2,'#fcfcfc');
}

// ---------- sprites ----------
const DPAL={G:'#18a838',K:'#000',L:'#5cd8fc',W:'#fcfcfc',B:'#9c4c1c',g:'#c4c4c4',d:'#5c3c1c',O:'#fca018'};
const DUCK_ROWS=[
 [ // wings up
  "    dd",
  "     ddd",
  "      ddd       GGG",
  "       ddd     GGGGG",
  "        ddd   GKKLKGOO",
  "         dd   GGGGGGOOO",
  "          d    GGGG",
  "  gg   gggggggWWWW",
  " gggggggggggggBBBB",
  "ggggggggggggggBBBBKKKKK",
  " ggggggggggggBBBB KK",
  "   ggggggggggBB",
  "      OO  OO","",""],
 [ // wings level
  "","",
  "                GGG",
  "               GGGGG",
  "              GKKLKGOO",
  "              GGGGGGOOO",
  " dddddddddd    GGGG",
  "  ddddddddddd WWWW",
  " gggggggggggggBBBB",
  "ggggggggggggggBBBBKKKKK",
  " ggggggggggggBBBB KK",
  "   ggggggggggBB",
  "      OO  OO","",""],
 [ // wings down
  "","",
  "                GGG",
  "               GGGGG",
  "              GKKLKGOO",
  "              GGGGGGOOO",
  "               GGGG",
  "  gg   gggggggWWWW",
  " gggggggggggggBBBB",
  "gggggddddgggggBBBBKKKKK",
  " ggggddddggggBBBB KK",
  "   gggddddgggBB",
  "      ddddd",
  "       ddd",
  "        d"]
];
const duckR=DUCK_ROWS.map(r=>sprite(r,DPAL)), duckL=duckR.map(flip);

const HPAL={
  earl:  {H:'#fc7418',h:'#c84c0c',F:'#fcb88c',K:'#000',R:'#7c4818',V:'#fc7418',C:'#2c6c1c',c:'#1c4c0c',J:'#2c5cbc',b:'#4c2c0c'},
  cletus:{H:'#d82828',h:'#a01010',F:'#fcb88c',K:'#000',R:'#d8a850',V:'#6c4c2c',C:'#d82828',c:'#3c0c0c',J:'#3c4cac',b:'#4c2c0c'},
  todd:  {H:'#2c2c2c',h:'#101010',F:'#e0a070',K:'#000',R:'#e0a070',V:'#3c3c3c',C:'#5c5c5c',c:'#202020',J:'#303030',b:'#101010',shades:1},
  gary:  {H:'#fcfc3c',h:'#c8a800',F:'#fcd8a8',K:'#000',R:'#fcd8a8',V:'#fce03c',C:'#fcfc9c',c:'#c8a800',J:'#e0b020',b:'#a07800'},
  bubba: {H:'#3c5cbc',h:'#1c2c7c',F:'#fcb88c',K:'#000',R:'#fcb88c',V:'#3c5cbc',C:'#a4b8e8',c:'#3c5cbc',J:'#1c2c5c',b:'#101010'},
  gus:   {H:'#3c7c1c',h:'#1c4c0c',F:'#7ca85c',K:'#000',R:'#7ca85c',V:'#2c6c1c',C:'#4c8c2c',c:'#1c4c0c',J:'#2c5c1c',b:'#1c2c0c'},
  boomer:{H:'#fcfcfc',h:'#bcbcbc',F:'#fcb88c',K:'#000',R:'#5c3c1c',V:'#bc2c2c',C:'#fcd83c',c:'#bc2c2c',J:'#5c3c1c',b:'#2c1c0c'},
  ron:   {H:'#bcbcc8',h:'#7c7c8c',F:'#fcb88c',K:'#000',R:'#fcb88c',V:'#7c7c8c',C:'#e4e4f0',c:'#3cbcfc',J:'#5c5c6c',b:'#fc7418',shades:1}
};
const TYPES={
  earl:  {name:'EARL',  pts:500, fire:[2.3,3.3],spd:80, burst:1,spread:1,walk:26},
  cletus:{name:'CLETUS',pts:1000,fire:[1.8,2.7],spd:92, burst:2,spread:1,walk:32},
  todd:  {name:'TODD',  pts:1500,fire:[1.6,2.4],spd:100,burst:1,spread:3,walk:48},
  gary:  {name:'GARY',  pts:5000,fire:[1.5,2.2],spd:100,burst:1,spread:1,walk:62},
  bubba: {name:'BUBBA', pts:1500,fire:[2.0,3.0],spd:85, burst:1,spread:1,walk:22,armor:1},
  gus:   {name:'GUS',   pts:1500,fire:[1.8,2.6],spd:95, burst:1,spread:1,walk:30,camo:1},
  boomer:{name:'BOOMER',pts:1500,fire:[2.4,3.2],spd:90, burst:1,spread:1,walk:28,lob:1},
  ron:   {name:'RON',   pts:2000,fire:[1.7,2.4],spd:95, burst:1,spread:1,walk:40,jet:1}
};
const hCache={};
function hunterSpr(type,legs,face,flipX,hat=true){
  const k=type+legs+face+flipX+hat;if(hCache[k])return hCache[k];
  const p=HPAL[type];
  const eye=face==='x'?'   FKFKF':p.shades?'   FKKKK':'   FFFKF';
  const mouth=(face==='open'||face==='x')?'   RKKKR':'   RRRRR';
  const head=hat?['   HHHH','  HHHHHH','  hhhhhhhh']:['','','   FFFF'];
  const rows=[...head,'   FFFFF',eye,'   FFFFFF',mouth,'    RRR','  VCCCCV',' VVCcCCVV',' VVCCcCVV',' VVCcCCVV',' FVCCCCVF','  JJJJJJ',
    ...(legs?[' JJ    JJ',' JJ    JJ','JJ      JJ','bb      bbb']:['  JJ  JJ','  JJ  JJ','  JJ  JJ','  bb  bbb'])];
  let s=sprite(rows,p);if(flipX)s=flip(s);return hCache[k]=s;
}
const hatSpr={};for(const t in HPAL)hatSpr[t]=sprite(['  HHHH',' HHHHHH','hhhhhhhh'],HPAL[t]);
const heartSpr=sprite([' RR RR','RwRRRRR','RRRRRRR',' RRRRR','  RRR','   R'],{R:'#fc3c3c',w:'#fcfcfc'});
const shellSpr=sprite(['RRR','RRR','RRR','RRR','YYY','YYY'],{R:'#d82800',Y:'#fcc000'});
const eggSpr=sprite([' WW ','WWWW','WWWW','WWWW','WWWW',' WW '],{W:'#fcfcfc'});
const boltSpr=sprite(['  YY',' YY ','YYYY','  YY',' YY ','YY  '],{Y:'#fcfc3c'});
const lidSpr=sprite(['ggg','gwg','ggg','ggg','ggg','ggg'],{g:'#9c9ca8',w:'#fcfcfc'});
const SP_SAY={bubba:'TRY ME, BIRD!',gus:"I'M JUST A BUSH",boomer:'FIRE IN THE HOLE!',ron:'JETPACK, BABY!'};
const iconRows=['  XXX',' XXXXX','XXXXXXX','  XXX','  XXX'];
const icon={w:sprite(iconRows,{X:'#fcfcfc'}),r:sprite(iconRows,{X:'#fc3c3c'}),g:sprite(iconRows,{X:'#5c5c5c'})};

// ---------- background layers (tileable, for parallax scrolling) ----------
const TAU=Math.PI*2;
const farL=mk(W,H),midL=mk(512,H),trunkL=mk(512,H),leafSpr=mk(22,22),bushSpr=mk(20,17),grassL=mk(W,H),frontL=mk(W,H),dirtL=mk(W,H);
function blob(g,cx,cy,r,c1,c2,c3){
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    const a=Math.atan2(y,x),e=r-2+Math.sin(a*6+cx)*2.2+Math.sin(a*11)*1.2,d=Math.hypot(x,y);
    if(d<e){let c=c1;if(d>e-2)c=c3;else if(srand()<.16||(y<-r*.3&&srand()<.25))c=c2;g.fillStyle=c;g.fillRect(cx+x,cy+y,1,1);}
  }
}
const LEAF=['#2c9c1c','#58d854','#106c08'];
function tree(g,x,s){ // x = trunk left edge
  const tw=Math.round(15*s),top=Math.round(182-112*s);
  g.fillStyle='#8c4c1c';g.fillRect(x,top,tw,184-top);
  g.fillStyle='#5c2c0c';g.fillRect(x+4,top+12,1,95*s);g.fillRect(x+10,top+6,1,104*s);
  g.fillStyle='#8c4c1c';g.fillRect(x+tw,top+34*s,16*s,4);g.fillRect(x+tw+12*s,top+24*s,4,12);g.fillRect(x-14*s,top+46*s,14*s,4);g.fillRect(x-14*s,top+38*s,4,10);
  blob(g,x+8,Math.round(top-18*s),Math.round(30*s),...LEAF);
  blob(g,Math.round(x+tw+17*s),Math.round(top+18*s),Math.round(11*s),...LEAF);
  blob(g,Math.round(x-12*s),Math.round(top+34*s),Math.round(9*s),...LEAF);
}
const TREES=[{x:40,s:1},{x:268,s:.9},{x:350,s:.75}];
for(const t of TREES){t.tw=Math.round(15*t.s);t.top=Math.round(182-112*t.s);t.cx=t.x+t.tw/2;t.px=t.x+8;t.py=Math.round(t.top-18*t.s)+9;}
(function(){
  // far treeline (period 256)
  let g=farL.getContext('2d');
  for(let x=0;x<W;x++){const h=10+Math.sin(x*TAU*3/W)*5+Math.sin(x*TAU*9/W)*3+srand()*2;g.fillStyle='#0c7c3c';g.fillRect(x,Math.round(182-h),1,Math.round(h)+2);}
  // mid scenery (period 512): trees, bushes, the sign
  g=midL.getContext('2d');
  for(const t of TREES)tree(g,t.x,t.s);
  { // trunk overlay: drawn in front of hiding hunters
    const o=trunkL.getContext('2d');
    for(const t of TREES){const y0=Math.round(t.top+14*t.s);
      o.fillStyle='#8c4c1c';o.fillRect(t.x,y0,t.tw,194-y0);
      o.fillStyle='#5c2c0c';o.fillRect(t.x+4,y0,1,188-y0);o.fillRect(t.x+10,y0,1,184-y0);
      for(let i=-2;i<t.tw+2;i++){const bh=1+Math.floor(srand()*4);o.fillStyle=srand()<.5?'#2c8a10':'#58c838';o.fillRect(t.x+i,194-bh,1,bh);}}
    blob(leafSpr.getContext('2d'),11,11,9,...LEAF);blob(bushSpr.getContext('2d'),10,8,8,...LEAF);
  }
  blob(g,228,168,19,...LEAF);blob(g,204,176,12,...LEAF);blob(g,470,172,15,...LEAF);blob(g,140,178,9,...LEAF);
  g.fillStyle='#6c3c0c';g.fillRect(150,160,3,24);
  g.fillStyle='#c89c5c';g.fillRect(132,150,40,13);g.strokeStyle='#6c3c0c';g.strokeRect(132.5,150.5,39,12);
  g.drawImage(sprite(['K   K  KKK','KK  K K   K','K K K K   K','K  KK K   K','K   K  KKK'],{K:'#6c3c0c'}),137,154);
  g.fillStyle='#6c3c0c';g.fillRect(156,155,6,3);g.fillRect(160,153,3,2);
  g.fillStyle='#d82800';for(let i=0;i<10;i++)g.fillRect(154+i,151+i,1,1);
  // back grass band (period 256)
  g=grassL.getContext('2d');
  g.fillStyle='#3ca81c';g.fillRect(0,182,W,20);
  for(let x=0;x<W;x++){const bh=2+Math.floor(srand()*9);g.fillStyle=srand()<.5?'#3ca81c':'#2c8a10';g.fillRect(x,182-bh,1,bh);
    if(srand()<.2){g.fillStyle='#7ce03c';g.fillRect(x,182-bh,1,1);}}
  for(let i=0;i<120;i++){g.fillStyle=srand()<.5?'#2c8a10':'#58c838';g.fillRect(Math.floor(srand()*W),184+Math.floor(srand()*16),1,2);}
  // front tufts (period 256)
  g=frontL.getContext('2d');
  for(let x=0;x<W;x++){
    if(Math.sin(x*TAU*8/W)+Math.sin(x*TAU*3/W)>.3){const bh=2+Math.floor(srand()*7);g.fillStyle=srand()<.5?'#2c8a10':'#58c838';g.fillRect(x,200-bh,1,bh);}
  }
  // dirt (period 256)
  g=dirtL.getContext('2d');
  g.fillStyle='#9c5c1c';g.fillRect(0,200,W,40);
  g.fillStyle='#6c3c0c';g.fillRect(0,200,W,1);
  for(let i=0;i<260;i++){g.fillStyle=srand()<.6?'#7c4410':'#b8743c';g.fillRect(Math.floor(srand()*(W-1)),201+Math.floor(srand()*39),2,1);}
})();
function tile(img,off,period){const o=Math.round(((off%period)+period)%period);ctx.drawImage(img,-o,0);ctx.drawImage(img,period-o,0);}
const clouds=[{x:70,y:22,v:4,s:1},{x:170,y:44,v:2.5,s:.8},{x:230,y:14,v:3.2,s:1.1}];
function drawCloud(c){const x=Math.round(c.x),y=c.y,s=c.s;ctx.fillStyle='#fcfcfc';
  ctx.fillRect(x+6*s,y,14*s,4);ctx.fillRect(x,y+4,30*s,6);ctx.fillRect(x+3*s,y+10,22*s,3);}

// ---------- audio (hand-rolled 8-bit) ----------
let AC=null,muted=false,nbuf=null;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,o={}){
  if(!AC||muted)return;try{
  const t=AC.currentTime+(o.delay||0),osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=o.vol||.06;g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g);g.connect(AC.destination);osc.start(t);osc.stop(t+d+.05);}catch(e){}
}
function noise(d,o={}){
  if(!AC||muted)return;try{
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime+(o.delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf;fl.type='lowpass';fl.frequency.value=o.freq||4000;
  g.gain.setValueAtTime(o.vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.05);}catch(e){}
}
function seq(notes,o={}){let t=0;for(const[f,d]of notes){if(f)tone(f,d*.92,{...o,delay:(o.delay||0)+t});t+=d;}}
const sfx={
  shoot(){noise(.25,{vol:.35,freq:3000});tone(170,.12,{to:60,vol:.1});},
  hshot(){noise(.2,{vol:.16,freq:1100});tone(110,.1,{to:50,vol:.05});},
  click(){tone(1800,.03,{vol:.05});tone(900,.03,{vol:.05,delay:.06});},
  hit(){tone(900,.3,{to:200,vol:.07});},
  stab(){tone(2600,.12,{type:'sawtooth',to:1300,vol:.04});noise(.08,{vol:.2,freq:6000});tone(200,.2,{to:80,vol:.08,delay:.05});},
  swoop(){tone(1500,.35,{to:300,vol:.04,type:'triangle'});},
  fall(){tone(1600,.9,{to:220,vol:.03});},
  hurt(){tone(600,.08,{vol:.07,to:400});tone(500,.14,{vol:.07,to:250,delay:.09});},

    G.parts.push({kind:'hat',spr:hatSpr[m.type],x:m.x,y:m.y-17,vx:rnd(-35,35),vy:-120,rot:0,vr:rnd(-9,9),life:2.5});if(!all)break;}
  return n;}
function drawMobs(){
  for(const m of G.mobs){if(m.dead)continue;const X=Math.round(m.x),Y=Math.round(m.y);
    if(m.kind==='para'){ctx.fillStyle='#fcfcfc';ctx.fillRect(X-8,Y-35,16,3);ctx.fillRect(X-10,Y-32,20,4);ctx.fillStyle='#fc7418';ctx.fillRect(X-3,Y-35,6,7);
      pixLine(X-9,Y-28,X-3,Y-16,'#c4c4c4');pixLine(X+9,Y-28,X+3,Y-16,'#c4c4c4');}
    ctx.drawImage(hunterSpr(m.type,m.kind==='run'?Math.floor(m.t*10)%2:0,'n',m.kind==='run'?m.dir<0:duck.x<m.x),X-5,Y-18);}
}
function updBoss2(B,dt,ps,bs,sm){
  const dxb=duck.x-B.x,k=B.kind,live=!duck.dead&&!duck.intro;
  if(k===4){ // Trojan Decoy: rolls around closed, then the hatch opens and the hunters inside open fire
    const tb=turboTick(B,dt,Math.abs(dxb)>105);
    B.pt-=dt;if(B.pt<=0){B.open=!B.open;B.pt=B.open?2.8:2.4*ps;B.n=0;B.fireT=.5;if(B.open){sfx.rustle();popTxt(clamp(B.x,50,206),B.y-54,'SURPRISE!','#fcfcfc');}}
    if(tb){if(Math.abs(dxb)>6){B.dir=dxb>0?1:-1;B.x+=B.dir*120*dt;}}
    else{B.x-=G.cen*dt;if(!B.open)B.x+=B.dir*30*dt;if(B.x<40){B.x=40;B.dir=1;}if(B.x>216){B.x=216;B.dir=-1;}}
    B.x=clamp(B.x,26,W-26);
    if(B.open&&live){B.fireT-=dt;if(B.fireT<=0){B.n++;const ox=B.x,oy=B.y-24;
      if(B.n===3||(G.type===2&&B.n===6))lob(ox,oy);else eb(ox,oy,leadAim(ox,oy,bs*1.1,sm)+rnd(-.08,.08),bs*1.1);
      B.fireT=.42*Math.max(.7,ps);sfx.hshot();}}
  }else if(k===5){ // Bass Boat Bill: fast boat, fishing hook that reels the duck in
    B.stall=Math.max(0,B.stall-dt);
    const tb=turboTick(B,dt,Math.abs(dxb)>105);
    if(B.stall<=0){
      if(tb){if(Math.abs(dxb)>6){B.dir=dxb>0?1:-1;B.x+=B.dir*150*dt;}}
      else{B.x-=G.cen*dt;B.x+=B.dir*(60+G.round*2)*dt;if(B.x<36){B.x=36;B.dir=1;}if(B.x>220){B.x=220;B.dir=-1;}}
      if(Math.random()<dt*25)G.parts.push({kind:'star',x:B.x-B.dir*30,y:B.y-rnd(0,4),vx:-B.dir*rnd(20,50),vy:rnd(-30,-5),life:.35,col:'#fcfcfc'});
    }else{if(!tb)B.x-=G.cen*dt;if(Math.random()<dt*14)G.parts.push({kind:'star',x:B.x-B.dir*28,y:B.y-12,vx:rnd(-6,6),vy:-22,life:.6,col:'#5c5c5c'});}
    B.x=clamp(B.x,30,W-30);
    if(live){B.fireT-=dt*(tb?1.5:1);if(B.fireT<=0){B.n++;const ox=B.x+B.dir*6,oy=B.y-30;
      if(B.n%3===1&&!duck.hook){const sp=165,a=leadAim(ox,oy,sp,Math.min(1,.4+sm));G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,hook:true,life:1.25});tone(900,.2,{to:400,vol:.04,type:'triangle'});}
      else if(B.n%3===2){const a=leadAim(ox,oy,bs,sm);eb(ox,oy,a-.1,bs);eb(ox,oy,a+.1,bs);sfx.hshot();}
      else lob(ox,oy);
      B.fireT=1.4*ps;}}
  }else if(k===6){ // Hunt-Mart Blimp: slow and huge, drops paratroopers
    const tb=turboTick(B,dt,Math.abs(dxb)>125);
    if(tb)B.x+=clamp(dxb*3,-70,70)*dt;
    else{B.x-=G.cen*.5*dt;B.x+=B.dir*16*dt;if(B.x<60){B.x=60;B.dir=1;}if(B.x>196){B.x=196;B.dir=-1;}}
    B.x=clamp(B.x,54,W-54);
    if(B.hp<B.maxHp*.66&&Math.random()<dt*10)G.parts.push({kind:'star',x:B.x-B.dir*39,y:B.y+10,vx:rnd(-6,6),vy:-20,life:.7,col:'#5c5c5c'});
    if(B.hp<B.maxHp*.33&&Math.random()<dt*10)G.parts.push({kind:'star',x:B.x+B.dir*39,y:B.y+10,vx:rnd(-6,6),vy:-20,life:.7,col:'#5c5c5c'});
    if(live){B.fireT-=dt*(tb?1.5:1);if(B.fireT<=0){B.n++;
      if(B.n%3===1){const n=Math.min(1+(G.type>0?1:0),4-G.mobs.length);
        for(let i=0;i<n;i++)G.mobs.push({kind:'para',x:clamp(B.x+rnd(-36,36),14,W-14),y:B.y+26,t:rnd(0,3),fired:false,type:pick(['earl','cletus','todd']),dir:1});
        if(n>0)popTxt(clamp(B.x,50,206),B.y+38,'GERONIMO!','#fcfcfc');}
      else if(B.n%3===2){lob(B.x-40,B.y+16);if(G.type>0)lob(B.x+40,B.y+16);}
      else{const ox=B.x,oy=B.y+24,a=leadAim(ox,oy,bs,sm);for(let j=-1;j<=1;j++)eb(ox,oy,a+j*.16,bs);sfx.hshot();}
      B.fireT=1.6*ps;}}
  }else if(k===7){ // Sergeant Blind: hides in one of three bushes, pops up, fires, moves
    B.pt-=dt;B.dir=dxb>=0?1:-1;
    if(B.ph==='down'){if(B.pt<=0){B.ph='tell';B.pt=.55;sfx.rustle();}}
    else if(B.ph==='tell'){
      if(Math.random()<dt*25)G.parts.push({kind:'feather',x:B.x+rnd(-9,9),y:B.y-rnd(4,14),vx:rnd(-12,12),vy:-10,life:.6,col:pick(['#58d854','#2c9c1c'])});
      if(B.pt<=0){B.ph='up';B.pt=1.9;B.n=0;B.fireT=.3;popTxt(clamp(B.x,40,216),B.y-38,'TEN-HUT!','#fcfcfc');}}
    else{
      if(live){B.fireT-=dt;if(B.fireT<=0&&B.n<3){B.n++;const ox=B.x,oy=B.y-18,sp=bs*1.15,a=leadAim(ox,oy,sp,Math.min(1,.5+sm)),m=G.type===2?3:2;
        for(let j=0;j<m;j++)eb(ox,oy,a+(j-(m-1)/2)*.13,sp);B.fireT=.5;sfx.hshot();}}
      if(B.pt<=0){B.ph='down';B.pt=Math.max(.6,1.3*ps)*(B.hp<B.maxHp/2?.7:1);
        const idx=[0,1,2,3,4].filter(i=>i!==B.spot).sort(()=>Math.random()-.5);B.spot=idx[0];B.fakes=[idx[1],idx[2]];B.x=BLIND_X[B.spot];}}
  }else if(k===8){ // Ma: rolling pins, pies, a frying pan, and she calls the boys back
    B.pan=Math.max(0,B.pan-dt);
    const tb=turboTick(B,dt,Math.abs(dxb)>105);
    if(Math.abs(dxb)>8){B.dir=dxb>0?1:-1;B.x+=B.dir*(tb?110:26)*dt;}
    if(!tb)B.x-=G.cen*dt;B.x=clamp(B.x,16,W-16);
    if(live){B.fireT-=dt*(tb?1.5:1);if(B.fireT<=0){B.n++;const ox=B.x+B.dir*6,oy=B.y-22;let c=B.n%4;
      if(c===0&&G.mobs.length>=3)c=2;
      if(c===1){const t=.95,g=240,tx=clamp(duck.x+duck.vx*.3*(.5+sm),12,W-12),ty=duck.y;
        G.bullets.push({x:ox,y:oy,vx:(tx-ox)/t,vy:(ty-oy)/t-.5*g*t,g,pin:true,life:3});tone(300,.15,{to:500,vol:.04,type:'triangle'});}
      else if(c===2){const sp=bs*1.4,a=leadAim(ox,oy,sp,Math.min(1,.4+sm));G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,pie:true,life:4});sfx.hshot();}
      else if(c===3){B.pan=.9;popTxt(clamp(B.x,70,186),B.y-42,'NOT IN MY HOUSE!','#fcfcfc');tone(1000,.08,{vol:.05});}
      else{for(const sd of (G.type>0?[-1,1]:[Math.random()<.5?-1:1]))G.mobs.push({kind:'run',x:sd<0?-8:W+8,y:GROUND,dir:-sd,t:0,fired:false,type:pick(['earl','cletus'])});
        popTxt(clamp(B.x,64,192),B.y-42,'GET HIM, BOYS!','#fcfcfc');}
      B.fireT=1.25*ps;}}
  }else{ // The Kid with the Light Gun: a crosshair hunts the duck
    B.y+=clamp(clamp(duck.y,50,150)-B.y,-30,30)*dt;
    B.reload=Math.max(0,B.reload-dt);
    const low=B.hp<B.maxHp*.35;
    if(low&&live){B.glT-=dt;if(B.glT<=0){B.glT=7;G.flip=1.6;G.msg={s:'TRACKING ERROR! CONTROLS FLIP',t:1.6};noise(.4,{vol:.15,freq:3000});}}
    B.cx=clamp(B.cx-G.cen*dt,8,W-8);
    if(B.reload>0){}
    else if(B.lock>0){B.lock-=dt;if(B.lock<=0){
      sfx.shoot();if(flashOn)G.zap=2;G.shake=Math.max(G.shake,.15);G.booms.push({x:B.cx,y:B.cy,r:12,t:.3});
      if(live&&duck.inv<=0&&Math.hypot(duck.x-B.cx,duck.y-B.cy)<14)hurt();
      B.shots++;B.pt=1.3*ps*(low?.75:1);if(B.shots%3===0){B.reload=2.2;popTxt(196,clamp(B.y-24,24,170),'RELOADING...','#fcfc3c');}}}
    else{const sp=(70+5*G.round)*[1,1.1,1.2][G.type]*(low?1.2:1),dx=duck.x-B.cx,dy=duck.y-B.cy,d=Math.hypot(dx,dy)||1,st=Math.min(d,sp*dt);
      B.cx+=dx/d*st;B.cy+=dy/d*st;
      B.pt-=dt;if(B.pt<=0&&live){B.lock=.5;for(let i=0;i<3;i++)tone(1400,.07,{vol:.05,delay:i*.15});}}
  }
}

  }
}
function endWave(){
  const esc=G.slots.some((s,i)=>s===2&&i>=G.idx&&i<G.idx+G.waveN);
  G.phase='waveEnd';G.t=1.9;G.bullets=[];
  if(esc){G.extra={kind:'laugh',x:128,t:0};sfx.laugh();}
  else{G.extra={kind:'victory',x:clamp(G.lastKillX,40,216),t:0,hat:G.lastHat};sfx.victory();}
}
function tally(){
  const hits=G.slots.filter(s=>s===1).length;G.hits=hits;G.pass=hits>=quota(G.round);G.perfect=hits===10;
  G.phase='tally';G.t=3;
  if(G.perfect){G.score+=10000;sfx.perfect();}else if(G.pass)sfx.pass();else sfx.sad();
}
function winGame(){ // every boss beaten
  if(G.phase==='gameover'||G.phase==='initials')return;
  G.won=true;G.bonus=G.hp*1000*(G.type+1);G.score+=G.bonus;
  G.qual=scores.length<5||G.score>scores[scores.length-1].s;
  G.phase='gameover';G.t=3;G.items=[];G.boss=null;G.eggsOut=[];G.mobs=[];G.flip=0;G.bullets=[];G.hunters=[];G.rage=false;G.msg=null;
  G.extra={kind:'victory',x:128,t:0,hat:hatSpr.gary};
  if(G.score>topScore){topScore=G.score;saveTop();}
  sfx.jingle();setTimeout(()=>{if(G&&G.won)sfx.perfect();},900);
}
function gameOver(){
  if(G.phase==='gameover'||G.phase==='initials')return;
  G.qual=G.score>0&&(scores.length<5||G.score>scores[scores.length-1].s);
  G.phase='gameover';G.t=1.8;G.items=[];G.boss=null;G.eggsOut=[];G.mobs=[];G.flip=0;G.extra={kind:'laugh',x:128,t:0};G.bullets=[];G.hunters=[];G.newTop=false;
  if(G.score>topScore){topScore=G.score;saveTop();G.newTop=true;}
  sfx.gameover();setTimeout(()=>{if(G&&G.phase==='gameover')sfx.laugh();},1300);
}

function updDuck(dt){
  duck.swoopCd=Math.max(0,duck.swoopCd-dt);duck.inv=Math.max(0,duck.inv-dt);
  if(duck.dead){duck.vy+=300*dt;duck.y+=duck.vy*dt;duck.rot+=10*dt;
    if(Math.random()<.3)G.parts.push({kind:'feather',x:duck.x,y:duck.y,vx:rnd(-20,20),vy:rnd(-30,0),life:1.2,col:'#fcfcfc'});
    if(duck.y>225)gameOver();return;}
  duck.flapT+=dt*12;
  if(duck.intro){duck.y+=duck.vy*dt;if(duck.y<=118){duck.intro=false;duck.vy=0;sfx.quack();}return;}
  if(duck.hook){const B=G.boss;if(!B||B.state!=='fight')duck.hook=null;
    else{duck.vx=duck.vy=0;duck.x+=clamp(B.x-duck.x,-40,40)*dt;duck.y+=50*dt;
      if(duck.y>=172){duck.hook=null;duck.vy=-140;duck.inv=0;popTxt(clamp(duck.x,50,206),duck.y-30,'SPLASH!','#5cd8fc');hurt();}
      return;}}
  if(duck.swoop>0){
    duck.swoop-=dt;duck.x+=duck.vx*dt;duck.y+=duck.vy*dt;
    const kx=duck.x+duck.face*11,ky=duck.y+3;
    for(const h of G.hunters)if(alive(h)&&onScreen(h)&&Math.abs(kx-h.x)<9&&ky>h.y-21&&ky<h.y+3)damageHunter(h,'knife');
    if(G.mobs.length&&mobHit((px,py)=>Math.abs(kx-px)<9&&Math.abs(ky-py)<12,true)){sfx.stab();G.stats.knife++;}
    {const B=G.boss;if(B&&B.state==='fight'&&B.hitCd<=0){const b=bbox(B);if(kx>b.x&&kx<b.x+b.w&&ky>b.y&&ky<b.y+b.h){B.hitCd=.6;hitBoss(3,'knife',kx,ky);G.stats.knife++;sfx.stab();G.shake=.25;popTxt(clamp(duck.x,40,216),duck.y-16,'STABBY!','#fc5050');duck.swoop=0;}}}
    if(duck.y>192){duck.y=192;duck.swoop=0;}
    if(duck.x<8||duck.x>W-8){duck.x=clamp(duck.x,8,W-8);duck.swoop=0;}
    if(duck.y<10){duck.y=10;duck.swoop=0;}
    if(duck.swoop<=0){duck.swoop=0;duck.vx*=.25;duck.vy=-125;}
    return;
  }
  let ax=0,ay=0;
  if(K.a||K.arrowleft)ax--;if(K.d||K.arrowright)ax++;if(K.w||K.arrowup)ay--;if(K.s||K.arrowdown)ay++;
  if(G.flip>0){ax=-ax;ay=-ay;}
  const acc=700;duck.vx+=ax*acc*dt;duck.vy+=ay*acc*dt;
  if(!ax)duck.vx-=duck.vx*Math.min(1,4*dt);if(!ay)duck.vy-=duck.vy*Math.min(1,4*dt);
  const sp=Math.hypot(duck.vx,duck.vy),mxs=125;if(sp>mxs){duck.vx*=mxs/sp;duck.vy*=mxs/sp;}
  duck.x+=duck.vx*dt;duck.y+=duck.vy*dt;
  if(duck.x<10){duck.x=10;duck.vx=0;}if(duck.x>W-10){duck.x=W-10;duck.vx=0;}
  if(duck.y<14){duck.y=14;duck.vy=0;}if(duck.y>176){duck.y=176;duck.vy=Math.min(0,duck.vy);}
  if(ax)duck.face=ax;
}

function updPlay(dt){
  G.shake=Math.max(0,G.shake-dt);
  {const stop=duck.dead||G.phase==='gameover';
   const fly=duck.swoop>0||duck.intro?0:duck.vx;
   if(fly>25)G.dir=1;else if(fly<-25)G.dir=-1;
   const target=stop?0:clamp(G.dir*baseScroll()+fly*.12,-50,50);
   G.spd+=(target-G.spd)*Math.min(1,3*dt);
   // camera: the further the duck is from centre, the faster the world scrolls to bring it back
   G.cen=(stop||duck.intro||G.phase==='initials')?0:(duck.x-W/2)*3.4;
   G.gs=G.spd+G.cen;G.scroll+=G.gs*dt;}
  if(G.msg){G.msg.t-=dt;if(G.msg.t<=0)G.msg=null;}
  if(G.won&&Math.random()<dt*40)G.parts.push({kind:'feather',x:rnd(0,W),y:-2,vx:rnd(-12,12),vy:rnd(10,22),life:7,col:pick(['#fc3c3c','#fcfc3c','#7cfc3c','#5cd8fc','#fcfcfc','#fc7418'])});
  if((G.phase==='wave'||G.phase==='boss')&&!duck.dead){
    if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
    if(G.dbl>0)G.dbl-=dt;
    G.itemT-=dt;if(G.itemT<=0){spawnItem();G.itemT=rnd(8,13);}
    if(G.phase==='wave'){ // anti-camping: running away or hanging back far from every hunter makes them mad
      let md=1e9;for(const h of G.hunters)if(alive(h)&&onScreen(h))md=Math.min(md,Math.hypot(h.x-duck.x,h.y-10-duck.y));
      const bad=md<1e9&&(md>130||Math.abs(G.cen)>60);
      G.camp=clamp(G.camp+(bad?.45:-.9)*dt,0,2.2);
      const was=G.rage;G.rage=G.camp>1;
      if(G.rage&&!was){G.msg={s:"NO RUNNING! THEY'RE MAD!",t:1.8};sfx.flee();}
    }
  }
  for(const it of G.items){it.t+=dt;it.x+=(it.vx-G.spd*.3-G.cen)*dt;
    const yy=it.y+Math.sin(it.t*2)*6;
    if(!duck.dead&&!duck.intro&&G.phase!=='gameover'&&Math.abs(duck.x-it.x)<13&&Math.abs(duck.y-(yy+8))<15){it.gone=true;collect(it);}
    if(it.x<-30||it.x>W+30)it.gone=true;}
  G.items=G.items.filter(it=>!it.gone);
  if(G.tracer){G.tracer.t-=dt;if(G.tracer.t<=0)G.tracer=null;}
  updDuck(dt);
  if(G.cen&&!duck.dead)duck.x=clamp(duck.x-G.cen*dt,10,W-10);
  for(const h of G.hunters)updHunter(h,dt);
  if(G.beam){G.beam.t-=dt;if(G.beam.t<=0)G.beam=null;}
  for(const e of G.eggsOut){e.vy+=320*dt;e.x+=(e.vx-G.cen)*dt;e.y+=e.vy*dt;let hit=e.y>=GROUND+2;
    if(!hit)for(const h of G.hunters)if(alive(h)&&onScreen(h)&&Math.abs(e.x-h.x)<7&&e.y>h.y-20&&e.y<h.y){hit=true;break;}
    if(!hit&&G.boss&&G.boss.state==='fight'){const b=bbox(G.boss);if(e.x>b.x&&e.x<b.x+b.w&&e.y>b.y&&e.y<b.y+b.h)hit=true;}
    if(hit){e.gone=true;boom(e.x,Math.min(e.y,GROUND-6),24,false);}}
  G.eggsOut=G.eggsOut.filter(e=>!e.gone&&e.x>-20&&e.x<W+20);
  for(const b of G.booms){b.t-=dt;b.x-=G.cen*dt;}G.booms=G.booms.filter(b=>b.t>0);
  for(const b of G.bullets){if(b.dyn){b.vy+=b.g*dt;b.fuse-=dt;}if(b.pin)b.vy+=b.g*dt;
    if(b.msl){
      if(b.home>0){b.home-=dt;let cur=Math.atan2(b.vy,b.vx),df=Math.atan2(duck.y-b.y,duck.x-b.x)-cur;
        while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;cur+=clamp(df,-b.turn*dt,b.turn*dt);
        b.vx=Math.cos(cur)*b.spd;b.vy=Math.sin(cur)*b.spd;if(b.home<=0)b.life=Math.min(b.life,1.6);}
      if(Math.random()<dt*20)G.parts.push({kind:'star',x:b.x,y:b.y,vx:0,vy:-4,life:.35,col:b.home>0?'#c4c4c4':'#7c7c7c'});}
    b.x+=(b.vx-G.cen)*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.dyn&&(b.fuse<=0||b.y>194)){b.life=0;boom(b.x,b.y,17,true);continue;}
    if(!duck.dead&&!duck.intro&&duck.inv<=0&&Math.abs(b.x-duck.x)<7&&Math.abs(b.y-duck.y)<5){b.life=0;if(b.hook)hookDuck();else if(b.dyn)boom(b.x,b.y,17,true);else{if(b.msl)boomFx(b.x,b.y,9);hurt();}}}
  G.bullets=G.bullets.filter(b=>b.life>0&&b.x>-10&&b.x<W+10&&b.y>-10&&b.y<200);
  for(const p of G.parts){p.life-=dt;p.x+=(p.vx-G.cen)*dt;p.y+=p.vy*dt;
    if(p.kind==='hat'){p.vy+=260*dt;p.rot+=p.vr*dt;}
    else if(p.kind==='feather'){p.vx*=.97;p.vy=Math.min(p.vy+50*dt,22);p.x+=Math.sin(p.life*7)*.3;}}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const p of G.pops){p.t-=dt;p.y-=14*dt;p.x-=G.cen*dt;}G.pops=G.pops.filter(p=>p.t>0);
  if(G.extra)G.extra.t+=dt;
  switch(G.phase){
    case 'roundIntro':G.t-=dt;if(G.t<=0&&!duck.intro)startWave();break;
    case 'wave':
      if(!duck.dead){G.waveT-=dt;
        if(G.waveT<=0&&!G.fled){let any=false;
          for(const h of G.hunters)if(!['hit','fall','gone','flee'].includes(h.state)){h.state='flee';h.perched=false;h.behind=false;h.dir=h.x<W/2?-1:1;h.say={s:pick(FLEE_LINES),t:1.2};any=true;}
          G.fled=true;if(any){G.pink=1;G.combo=0;sfx.flee();}}
        if(G.hunters.every(h=>h.state==='gone'))endWave();}
      break;
    case 'waveEnd':G.t-=dt;if(G.t<=0){G.extra=null;G.idx+=G.waveN;if(G.idx>=10)tally();else startWave();}break;
    case 'tally':G.t-=dt;if(G.t<=0){if(G.pass){G.hp=Math.min(G.maxHp,G.hp+1);startBoss();}else gameOver();}break;
    case 'bossIntro':G.t-=dt;if(G.t<=0)spawnBoss();break;
    case 'boss':updBoss(dt);updMobs(dt);if(G.flip>0)G.flip-=dt;
      if(!duck.dead){G.regen+=dt;if(G.regen>1.1){G.regen=0;if(G.shells<5)G.shells++;}
        G.regen2+=dt;if(G.regen2>7){G.regen2=0;if(G.eggs<3)G.eggs++;}}
      break;
    case 'bossEnd':G.t-=dt;if(G.t<=0){if(G.round>=BOSS.length)winGame();else{G.extra=null;G.round++;newRound();}}break;
    case 'gameover':G.t-=dt;break;
  }
}
function update(dt){
  clock+=dt;
  if(toast){toast.t-=dt;if(toast.t<=0)toast=null;}
  tapMark=Math.max(0,tapMark-dt);
  const cs=(G&&mode==='play')?(G.gs||0)*.12:0;for(const c of clouds){c.x-=(c.v+cs)*dt;if(c.x<-40)c.x=W+10;else if(c.x>W+12)c.x=-38;}
  if(mode==='boot'){bootT+=dt;if(blown){blowT-=dt;if(blowT<=0){mode='title';titleT=0;}}return;}
  if(mode==='title'){titleT+=dt;return;}
  if(mode==='pause')return;
  updPlay(dt);
}

function drawDuck(){
  if(duck.inv>0&&!duck.dead&&Math.floor(duck.inv*16)%2)return;

// ---------- input ----------
const KONAMI=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
function blow(){if(blown)return;initAudio();blown=true;blowT=1.1;sfx.blow();}
function toTitle(){mode='title';titleT=0;G=null;}
function contOver(){
  if(G.t>0)return;
  if(G.qual){G.phase='initials';G.ini=lastIni.split('').map(c=>c.charCodeAt(0)-65);G.iniPos=0;sfx.menu();}
  else toTitle();
}
function iniKey(k){
  const I=G.ini;
  if(k==='arrowup'){I[G.iniPos]=(I[G.iniPos]+1)%26;sfx.menu();}
  else if(k==='arrowdown'){I[G.iniPos]=(I[G.iniPos]+25)%26;sfx.menu();}
  else if(k==='arrowleft'||k==='backspace'){G.iniPos=Math.max(0,G.iniPos-1);sfx.menu();}
  else if(k==='arrowright'||k==='enter'||k===' '||/^[a-z]$/.test(k)){
    if(/^[a-z]$/.test(k))I[G.iniPos]=k.charCodeAt(0)-97;
    G.iniPos++;sfx.menu();
    if(G.iniPos>2){
      lastIni=I.map(v=>String.fromCharCode(65+v)).join('');
      scores.push({n:lastIni,s:G.score});scores.sort((a,b)=>b.s-a.s);scores=scores.slice(0,5);
      topScore=Math.max(topScore,scores[0].s);saveScores();saveTop();sfx.perfect();toTitle();titleT=10.2;
    }
  }
}
function onPress(k){
  initAudio();
  if(mode==='play'&&G&&G.phase==='initials'){iniKey(k);return;}
  if(k==='m'){muted=!muted;setToast(muted?'SOUND OFF':'SOUND ON');return;}
  if(k==='c'){crtOn=!crtOn;crtEl.classList.toggle('off',!crtOn);setToast(crtOn?'CRT ON':'CRT OFF');return;}
  if(k==='f'){flashOn=!flashOn;setToast(flashOn?'ZAPPER FLASH ON':'ZAPPER FLASH OFF');return;}
  if(mode==='boot'){blow();return;}
  if(mode==='title'){
    if(showScores()){titleT=0;sfx.menu();return;}
    konami.push(k);if(konami.length>10)konami.shift();
    if(konami.join()===KONAMI.join()&&!cheat){cheat=true;sfx.cheat();setToast('+30 FEATHERS. CHEATER!');return;}
    if(k==='arrowup'||k==='w'){titleSel=(titleSel+2)%3;sfx.menu();}
    else if(k==='arrowdown'||k==='s'){titleSel=(titleSel+1)%3;sfx.menu();}
    else if(k==='enter'||k===' ')startGame(titleSel);
    return;
  }
  if(mode==='pause'){if(k==='p'||k==='escape'||k==='enter'){mode='play';}return;}
  if(mode==='play'){
    if(duck&&duck.hook&&['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){
      duck.hook.n--;tone(500+60*(6-duck.hook.n),.05,{vol:.05});
      if(duck.hook.n<=0){duck.hook=null;duck.vy=-120;duck.inv=.8;popTxt(clamp(duck.x,40,216),duck.y-20,'FREE!','#7cfc3c');sfx.quack();}
      return;}
    if(G.phase==='gameover'){if(k==='enter'||k===' ')contOver();return;}
    if(k==='p'||k==='escape'){mode='pause';return;}
    if(k===' ')swoop();
    else if(k==='q')setWpn(G.wpn+1);else if(k==='e'||k==='b')dropEgg();
    else if(k==='1'||k==='2'||k==='3')setWpn(+k-1);
  }
}
const KEYMAP={left:'arrowleft',right:'arrowright',up:'arrowup',down:'arrowdown',spacebar:' ',esc:'escape'};
function keyName(e){
  const c=e.code||'';
  if(c.indexOf('Arrow')===0)return c.toLowerCase();
  if(/^Key[A-Z]$/.test(c))return c[3].toLowerCase();
  if(c==='Space')return ' ';
  const k=(e.key||'').toLowerCase();return KEYMAP[k]||k;
}
window.addEventListener('keydown',e=>{
  const k=keyName(e);
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab','backspace'].includes(k))e.preventDefault();
  if(e.repeat&&K[k])return;
  if(!K[k])onPress(k);K[k]=true;
},true);
window.addEventListener('keyup',e=>{K[keyName(e)]=false;},true);
addEventListener('blur',()=>{for(const k in K)K[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&G&&G.phase!=='gameover')mode='pause';});

function toGame(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){[mx,my]=toGame(e);}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();try{window.focus();cv.focus({preventScroll:true});}catch(_){}
  [mx,my]=toGame(e);if(e.pointerType!=='mouse')tapMark=.25;
  if(mode==='boot'){blow();return;}
  if(mode==='title'){
    if(showScores()){titleT=0;sfx.menu();return;}
    for(let i=0;i<3;i++){const y=92+i*14;if(my>=y-4&&my<=y+11&&mx>30&&mx<226){titleSel=i;startGame(i);return;}}
    return;
  }
  if(mode==='pause'){mode='play';return;}
  if(G.phase==='initials'){iniKey('enter');return;}
  if(G.phase==='gameover'){contOver();return;}
  if(e.button===2)swoop();else fire(mx,my);
});
let wheelT=0;
cv.addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(n-wheelT<160)return;wheelT=n;if(mode==='play'&&G)setWpn(G.wpn+(e.deltaY>0?1:2));},{passive:false});
// touch pad
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k,act=b.dataset.act;
  const down=e=>{e.preventDefault();initAudio();
    if(k){if(!K[k])onPress(k);K[k]=true;}
    else if(mode==='play'&&G&&G.phase==='initials')iniKey(act==='knife'?'backspace':'enter');
    else if(act==='pause'){if(mode==='boot')blow();else if(mode==='title')startGame(titleSel);else if(mode==='play'&&G.phase==='gameover')contOver();else onPress('p');}
    else if(mode==='boot')blow();
    else if(mode==='title')startGame(titleSel);
    else if(mode==='pause')mode='play';
    else if(G&&G.phase==='gameover')contOver();
    else if(act==='wpn')setWpn(G.wpn+1);
    else if(act==='egg')dropEgg();
    else if(act==='fire'){const h=nearestTarget();if(h){mx=h.x;my=h.y;}else{mx=duck.x+duck.face*40;my=duck.y;}tapMark=.25;fire(mx,my);}
    else if(act==='knife')swoop();
  };
  const up=e=>{e.preventDefault();if(k)K[k]=false;};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
